<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <meta name="description" content="Spoon - The Most User Software.">
  <meta name="color-scheme" content="light">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://raw.githubusercontent.com/weirdo-kido/Spoon/refs/heads/main/assets/og-img.png">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥄</text></svg>">
  <title>Spoon</title>
    <style>
        * {
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent;
            contain: layout style; 
        }
        
        html, body { 
            background: #f5f5f7; color: #000; margin: 0; 
            font-family: 'ui-monospace', 'Cascadia Code', 'Source Code Pro', Menlo, Monaco, 'Courier New', monospace; 
            height: 100%; width: 100%; overflow: hidden;
            position: fixed; 
        }

        body { display: flex; flex-direction: column; }

        #grid { 
            flex: 1; display: flex; flex-direction: column;
            overflow-y: auto; background: #f5f5f7; padding: 1.5rem;
            scroll-behavior: smooth; 
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            transform: translateZ(0);
            will-change: scroll-position;
        }
        #grid::-webkit-scrollbar { display: none; }

        .note { 
            background: #f5f5f7; padding: 2.5rem 1rem; min-height: 150px; 
            width: 100%; border-bottom: 1px solid #e5e5e7;
            display: flex; align-items: center; justify-content: center;
            text-align: center; font-size: 1.15rem; line-height: 1.6;
            word-break: break-word; flex-shrink: 0;
            contain: content;
            animation: fadeIn 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            will-change: opacity, transform; user-select: none;
        }

        .note.archived { color: #bbb; font-style: italic; opacity: 0.6; }

        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(15px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        @media (min-width: 480px) { 
            #grid { flex-direction: row-reverse; flex-wrap: wrap-reverse; align-content: flex-start; }
            .note { width: 50%; border-right: 1px solid #e5e5e7; } 
        }

        #input-area { 
            flex-shrink: 0; padding: 2rem; background: #f5f5f7;
            z-index: 10; border-top: 1px solid #e5e5e7;
            padding-bottom: calc(1.5rem + env(safe-area-inset-bottom));
            box-shadow: 0 -5px 20px rgba(0,0,0,0.02);
        }

        input { 
            width: 100%; border: none; outline: none; font-size: 1.25rem; 
            padding: 10px 0; font-family: inherit; text-align: center; 
            background: transparent; transition: all 0.2s ease;
        }
    </style>
</head>
<body>
    <div id="grid"></div>
    <div id="input-area">
        <input type="text" id="noteInput" maxlength="70" placeholder="_" aria-label="Type here" autocomplete="off" spellcheck="false" enterkeyhint="send">
    </div>

<script>
const Spoon = {
    db: null,
    maxLen: 70,
    debounceTimer: null,
    pendingWrites: [],
    pageSize: 20, 
    lastTs: null, 
    isLoading: false,

    async init() {
        this.grid = document.getElementById('grid');
        this.input = document.getElementById('noteInput');
        this.setupSync();
        await this.initDB();
        this.loadNotes(false);
        this.bindEvents();
        this.setupInfiniteScroll();

        window.onbeforeunload = () => { if (this.pendingWrites.length > 0) this.flush(); };
    },

    setupSync() {
        this.channel = new BroadcastChannel('spoon_sync');
        this.channel.onmessage = (e) => { if (e.data === 'REFRESH') this.loadNotes(false); };
    },

    initDB() {
        return new Promise((resolve) => {
            const req = indexedDB.open("SPOON_DB", 2);
            req.onupgradeneeded = e => {
                const db = e.target.result;
                if (e.oldVersion < 1) db.createObjectStore("notes", { keyPath: "ts" });
                if (e.oldVersion < 2) {
                    const store = e.currentTarget.transaction.objectStore("notes");
                    if (!store.indexNames.contains('archived')) store.createIndex("archived", "archived", { unique: false });
                }
            };
            req.onsuccess = e => { this.db = e.target.result; resolve(); };
        });
    },

    async flush() {
        const dataToSave = [...this.pendingWrites];
        this.pendingWrites = [];
        await navigator.locks.request('spoon_db_lock', async () => {
            const tx = this.db.transaction("notes", "readwrite");
            dataToSave.forEach(n => tx.objectStore("notes").add(n));
        });
    },

    async saveNoteBatch(val) {
        const note = { ts: Date.now(), text: val, archived: false };
        this.grid.prepend(this.createNoteEl(note.text, note.archived));
        this.pendingWrites.push(note);

        clearTimeout(this.debounceTimer);
        this.debounceTimer = setTimeout(async () => {
            await navigator.locks.request('spoon_db_lock', async () => {
                if (this.pendingWrites.length === 0) return;
                const dataToSave = [...this.pendingWrites];
                this.pendingWrites = [];
                const tx = this.db.transaction("notes", "readwrite");
                dataToSave.forEach(n => tx.objectStore("notes").add(n));
                return new Promise(res => { tx.oncomplete = () => { this.channel.postMessage('REFRESH'); res(); }; });
            });
        }, 300);
    },

    createNoteEl(text, isArchived = false) {
        const div = document.createElement('div');
        div.className = 'note' + (isArchived ? ' archived' : '');
        div.textContent = text;
        return div;
    },

    loadNotes(showArchived = false, append = false) {
        if (this.isLoading) return;
        this.isLoading = true;
        if (!append) { this.grid.innerHTML = ''; this.lastTs = null; }

        navigator.locks.request('spoon_db_lock', { mode: 'shared' }, async () => {
            const tx = this.db.transaction("notes", "readonly");
            const store = tx.objectStore("notes");
            const fragment = document.createDocumentFragment();
            let count = 0;
            const range = this.lastTs ? IDBKeyRange.upperBound(this.lastTs, true) : null;
            const req = store.openCursor(range, "prev");

            req.onsuccess = e => {
                const cursor = e.target.result;
                if (cursor && count < this.pageSize) {
                    const n = cursor.value;
                    if (showArchived || !n.archived) {
                        fragment.appendChild(this.createNoteEl(n.text, n.archived));
                        this.lastTs = n.ts;
                        count++;
                    }
                    cursor.continue();
                } else {
                    this.grid.appendChild(fragment);
                    this.isLoading = false;
                }
            };
        });
    },

    setupInfiniteScroll() {
        this.grid.onscroll = () => {
            if (this.grid.scrollTop + this.grid.clientHeight >= this.grid.scrollHeight - 10) this.loadNotes(false, true);
        };
    },

    async handleExportNuke() {
        await navigator.locks.request('spoon_db_lock', async () => {
            return new Promise((resolve) => {
                const tx = this.db.transaction("notes", "readwrite");
                const store = tx.objectStore("notes");
                store.getAll().onsuccess = e => {
                    const data = e.target.result;
                    if (data.length > 0) {
                        const csv = "Timestamp,Note,Archived\n" + data.map(n => `${n.ts},"${n.text.replace(/"/g, '""')}",${!!n.archived}`).join("\n");
                        const blob = new Blob([csv], { type: 'text/csv' });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement("a");
                        a.href = url; a.download = `spoon_nuke_${Date.now()}.csv`;
                        document.body.appendChild(a); a.click();
                        setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 100);
                        store.clear();
                    }
                };
                tx.oncomplete = () => { this.grid.innerHTML = ''; this.channel.postMessage('REFRESH'); resolve(); };
            });
        });
    },

    async handleBackupJSON() {
        await navigator.locks.request('spoon_db_lock', { mode: 'shared' }, async () => {
            return new Promise((resolve) => {
                const tx = this.db.transaction("notes", "readonly");
                tx.objectStore("notes").getAll().onsuccess = e => {
                    const data = e.target.result;
                    if (data && data.length > 0) {
                        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement("a");
                        a.href = url; a.download = `spoon_backup_${Date.now()}.json`;
                        document.body.appendChild(a); a.click();
                        setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 100);
                    }
                    resolve();
                };
            });
        });
    },

    async handleArchive() {
        await navigator.locks.request('spoon_db_lock', async () => {
            const tx = this.db.transaction("notes", "readwrite");
            const store = tx.objectStore("notes");
            store.openCursor().onsuccess = e => {
                const cursor = e.target.result;
                if (cursor) {
                    if (!cursor.value.archived) {
                        const data = cursor.value;
                        data.archived = true;
                        cursor.update(data);
                    }
                    cursor.continue();
                }
            };
            tx.oncomplete = () => { this.loadNotes(false); this.channel.postMessage('REFRESH'); };
        });
    },

    bindEvents() {
        this.input.onkeydown = async e => {
            if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { this.handleArchive(); return; }
            if (e.key === 'Enter' && this.input.value.trim()) {
                const val = this.input.value.trim().substring(0, this.maxLen);
                if (val === ',export') await this.handleExportNuke();
                else if (val === ',send') await this.handleBackupJSON();
                else if (val === ',archive') await this.handleArchive();
                else if (val === ',reveal') this.loadNotes(true);
                else if (val === ',hide') this.loadNotes(false);
                else this.saveNoteBatch(val);
                this.input.value = '';
                this.input.blur();
            }
        };
        /* const focusInput = () => this.input.focus();
        document.addEventListener('click', focusInput);
        window.addEventListener('focus', focusInput); */
    }
};
Spoon.init();
</script>
</body>
</html>
